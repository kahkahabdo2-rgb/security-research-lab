name: Mattermost 12.0.2 Dialog Submit Native SSRF Boundary DSI
on:
  push:
    branches:
      - research/mattermost-dialog-submit-dsi-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dialog-ssrf:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        mode: [default-blocked, explicit-allowlist]
    steps:
      - uses: actions/checkout@v4
      - name: Launch unmodified official Mattermost 12.0.2 + disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mm-dlg-db --network host -e POSTGRES_USER=mmuser \
            -e POSTGRES_PASSWORD=mm_lab_only_password -e POSTGRES_DB=mattermost postgres:16-alpine
          args=()
          if [[ "${{ matrix.mode }}" == "explicit-allowlist" ]]; then
            args+=("-e" "MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS=127.0.0.1 localhost 127.1")
          fi
          docker run -d --name mm-dlg-app --network host \
            -e MM_SQLSETTINGS_DRIVERNAME=postgres \
            -e 'MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:mm_lab_only_password@127.0.0.1:5432/mattermost?sslmode=disable&connect_timeout=10' \
            -e MM_SERVICESETTINGS_SITEURL=http://127.0.0.1:8065 \
            -e MM_TEAMSETTINGS_ENABLEOPENSERVER=true \
            -e MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL=true \
            -e MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION=false \
            -e MM_LOGSETTINGS_ENABLEFILE=false \
            "${args[@]}" mattermost/mattermost-team-edition:12.0.2
          docker image inspect mattermost/mattermost-team-edition:12.0.2 --format 'OFFICIAL_IMAGE={{.RepoTags}} IMAGE_ID={{.Id}}'
      - name: Check native server ready
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 125); do
            if curl --silent --fail --max-time 3 http://127.0.0.1:8065/api/v4/system/ping >/dev/null; then
              echo "SERVER_READY=YES"
              exit 0
            fi
            sleep 5
          done
          echo "SERVER_READY=NO"
          docker logs mm-dlg-app --tail 40 | grep -E 'ERROR|FATAL|panic' || true
          exit 1
      - name: Execute native HTTP multi-user URL boundary tests
        env:
          DIALOG_ALLOWED: ${{ matrix.mode == 'explicit-allowlist' && '1' || '0' }}
        run: python3 labs/mattermost_dialog_submit_dsi.py
      - name: Error diagnostics
        if: failure()
        run: |
          docker ps --format '{{.Names}} {{.Status}}' || true
          docker logs mm-dlg-app 2>&1 | grep -E 'ERROR|FATAL|panic' | tail -25 || true
