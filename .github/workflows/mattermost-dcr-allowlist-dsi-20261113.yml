name: Mattermost OAuth DCR Allowlist DSI 12.0.2
on:
  push:
    branches:
      - research/mattermost-dcr-allowlist-dsi-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-dcr:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [disabled, strict]
    steps:
      - uses: actions/checkout@v4
      - name: Official Mattermost 12.0.2 with isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mm-dcr-db --network host \
            -e POSTGRES_USER=mmuser -e POSTGRES_PASSWORD=mm_lab_only_password \
            -e POSTGRES_DB=mattermost postgres:16-alpine
          args=()
          if [[ "${{ matrix.mode }}" == strict ]]; then
            args+=("-e" "MM_SERVICESETTINGS_ENABLEDYNAMICCLIENTREGISTRATION=true")
            args+=("-e" 'MM_SERVICESETTINGS_DCREDIRECTURIALLOWLIST=https://approved.example.invalid/cb')
          else
            args+=("-e" "MM_SERVICESETTINGS_ENABLEDYNAMICCLIENTREGISTRATION=false")
          fi
          docker run -d --name mm-dcr-app --network host \
            -e MM_SQLSETTINGS_DRIVERNAME=postgres \
            -e 'MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:mm_lab_only_password@127.0.0.1:5432/mattermost?sslmode=disable&connect_timeout=10' \
            -e MM_SERVICESETTINGS_SITEURL=http://127.0.0.1:8065 \
            -e MM_SERVICESETTINGS_ENABLEOAUTHSERVICEPROVIDER=true \
            -e MM_TEAMSETTINGS_ENABLEOPENSERVER=true \
            -e MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL=true \
            -e MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION=false \
            -e MM_LOGSETTINGS_ENABLEFILE=false \
            "${args[@]}" mattermost/mattermost-team-edition:12.0.2
          docker image inspect mattermost/mattermost-team-edition:12.0.2 --format 'OFFICIAL_IMAGE={{.RepoTags}} IMAGE_ID={{.Id}}'
      - name: Wait official HTTP health
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 120); do
            if curl --silent --fail --max-time 3 http://127.0.0.1:8065/api/v4/system/ping >/dev/null; then
              echo SERVER_READY=YES
              exit 0
            fi
            sleep 5
          done
          echo SERVER_READY=NO
          docker logs mm-dcr-app --tail 55 | grep -E 'ERROR|FATAL|panic' || true
          exit 1
      - name: Native DCR security transitions
        env:
          DCR_MODE: ${{ matrix.mode }}
        run: python3 labs/mattermost_dcr_allowlist_dsi.py
      - name: Diagnostic on failure
        if: failure()
        run: |
          docker ps --format '{{.Names}} {{.Status}}' || true
          docker logs mm-dcr-app 2>&1 | grep -E 'ERROR|FATAL|panic' | tail -25 || true
