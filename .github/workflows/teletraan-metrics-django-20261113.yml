name: Teletraan Metrics Validation Native Django HTTP Route Test

on:
  pull_request:
    paths:
      - '.github/workflows/teletraan-metrics-django-20261113.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-url-validator-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout official unmodified Teletraan source
        run: |
          git clone --depth 1 https://github.com/pinterest/teletraan.git upstream
          cd upstream
          test "$(git rev-parse HEAD)" = b5212f5ab50486d623fcb493cca36558c70ee467
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install Django-compatible lab runtime (app source unchanged)
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q 'Django==2.2.28' 'django-csp==3.4' 'requests==2.32.3' 'oauthlib==1.0.3' 'concurrent-log-handler==0.9.20' 'python-dateutil==2.8.2' 'pytz==2024.2' 'simplejson==3.19.3' 'diff-match-patch==20241021'
      - name: Generate synthetic local HTTPS-only secret service certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/teletraan-metrics-test.key -out /tmp/teletraan-metrics-test.crt -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' >/dev/null 2>&1
          mkdir -p /tmp/deploy-board-metrics-lab
      - name: Real Django URLConf and middleware with authenticated low-role session and proper CSRF
        env:
          PYTHONPATH: upstream/deploy-board
          DJANGO_SETTINGS_MODULE: deploy_board.settings
          OAUTH_ENABLED: 'ON'
          IS_PINTEREST: 'true'
          OAUTH_CLIENT_ID: 'lab-client'
          OAUTH_CLIENT_SECRET: 'lab-only-client-secret'
          OAUTH_CALLBACK: 'http://127.0.0.1:18888/auth'
          OAUTH_DOMAIN: 'lab.invalid'
          OAUTH_ACCESS_TOKEN_URL: 'https://example.invalid/oauth/token'
          OAUTH_AUTHORIZE_URL: 'https://example.invalid/oauth/authorize'
          OAUTH_DEFAULT_SCOPE: 'email'
          OAUTH_USER_INFO_URI: 'https://example.invalid/me'
          SECRET_KEY: 'random-lab-secret-key-only'
          TELETRAAN_SERVICE_URL: 'http://127.0.0.1:19999'
          TELETRAAN_SERVICE_VERSION: 'v1'
          LOG_DIR: /tmp/deploy-board-metrics-lab
          LOG_LEVEL: INFO
          DEBUG_MODE: 'OFF'
          SSL_CERT_FILE: /tmp/teletraan-metrics-test.crt
        run: |
          python - <<'PY'
          import json
          import ssl
          import time
          import threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import django
          from django.test import Client
          from django.conf import settings

          hits=[]
          class Target(BaseHTTPRequestHandler):
              def do_GET(self):
                  hits.append(self.path)
                  if self.path=='/valid':
                      body=json.dumps([{'datapoints': [[1700000000,99]]}]).encode()
                  else:
                      body=json.dumps([{'unrelated': 123}]).encode()
                  self.send_response(200)
                  self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length',str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self,*args):pass

          tls=ThreadingHTTPServer(('127.0.0.1',19444),Target)
          context=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain('/tmp/teletraan-metrics-test.crt','/tmp/teletraan-metrics-test.key')
          tls.socket=context.wrap_socket(tls.socket,server_side=True)
          threading.Thread(target=tls.serve_forever,daemon=True).start()

          django.setup()
          client=Client(enforce_csrf_checks=True)
          # Signed-cookie session simulates a legitimate, already-completed OAuth login.
          session=client.session
          session['oauth_token']='reader-lab-token'
          session['oauth_expires']=time.time()+3600
          session['teletraan_user']='reader-lab'
          session.save()
          client.cookies[settings.SESSION_COOKIE_NAME]=session.session_key

          csrf='a'*32
          client.cookies[settings.CSRF_COOKIE_NAME]=csrf

          def post(uri):
              return client.post('/validate_metrics_url/',data={'newEntryValue':uri},HTTP_X_CSRFTOKEN=csrf)

          http_control=post('http://127.0.0.1:19444/blocked')
          assert http_control.status_code==200,(http_control.status_code,http_control.content[:800])
          assert json.loads(http_control.content)=={'result':False} and hits==[],(http_control.content,hits)
          print('AUTHENTICATED_LOW_ROLE_CSRF_VALID_HTTP_PREFIX_CONTROL=PASS')

          allowed=post('https://127.0.0.1:19444/valid')
          assert allowed.status_code==200,(allowed.status_code,allowed.content[:800])
          assert json.loads(allowed.content)=={'result':True}
          assert hits==['/valid'],hits
          print('NATIVE_DJANGO_AUTHENTICATED_URL_VALIDATOR_INTERNAL_HTTPS_REQUEST=PASS')
          print('INTERNAL_RESPONSE_CONTENT_ORACLE_TRUE=PASS')

          different=post('https://127.0.0.1:19444/other')
          assert different.status_code==200 and json.loads(different.content)=={'result':False}
          assert hits==['/valid','/other'],hits
          print('INTERNAL_RESPONSE_CONTENT_ORACLE_FALSE=PASS')

          print('DJANGO_ROUTE_MIDDLEWARE_CSRF_E2E=PASS')
          print('NOTE: The original source is unchanged; the lab uses Django 2.2 with legacy django-csp for Python 3.8 compatibility, not the repository pinned Django 1.11 runtime.')
          PY
