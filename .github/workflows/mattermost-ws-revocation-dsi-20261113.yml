name: Mattermost 12.0.2 Core WebSocket Revocation E2E
on:
  push:
    branches:
      - research/mattermost-ws-revocation-dsi-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  websocket-revocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        iteration: [false, true]
    steps:
      - uses: actions/checkout@v4
      - name: Start unmodified Mattermost 12.0.2 and throwaway PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mm-ws-db --network host -e POSTGRES_USER=mmuser \
            -e POSTGRES_PASSWORD=mm_lab_only_password -e POSTGRES_DB=mattermost postgres:16-alpine
          docker run -d --name mm-ws-app --network host \
            -e MM_SQLSETTINGS_DRIVERNAME=postgres \
            -e 'MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:mm_lab_only_password@127.0.0.1:5432/mattermost?sslmode=disable&connect_timeout=10' \
            -e MM_SERVICESETTINGS_SITEURL=http://127.0.0.1:8065 \
            -e MM_TEAMSETTINGS_ENABLEOPENSERVER=true \
            -e MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL=true \
            -e MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION=false \
            -e MM_SERVICESETTINGS_ENABLEWEBHUBCHANNELITERATION=${{ matrix.iteration }} \
            -e MM_LOGSETTINGS_ENABLEFILE=false \
            mattermost/mattermost-team-edition:12.0.2
          docker image inspect mattermost/mattermost-team-edition:12.0.2 --format 'OFFICIAL_IMAGE={{.RepoTags}} IMAGE_ID={{.Id}}'
      - name: Wait for server
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 120); do
            if curl --silent --fail --max-time 3 http://127.0.0.1:8065/api/v4/system/ping >/dev/null; then
              echo 'SERVER_READY=YES'
              exit 0
            fi
            sleep 5
          done
          echo 'SERVER_READY=NO'
          docker logs mm-ws-app --tail 55 | grep -E 'ERROR|FATAL|panic' || true
          exit 1
      - name: Install websocket client
        run: python3 -m pip install --quiet websocket-client
      - name: Native attack-state transitions with independent REST control
        env:
          WS_ITERATION: ${{ matrix.iteration && '1' || '0' }}
        run: python3 labs/mattermost_ws_revocation_dsi.py
      - name: Diagnostic on failure
        if: failure()
        run: |
          docker ps --format '{{.Names}} {{.Status}}' || true
          docker logs mm-ws-app 2>&1 | grep -E 'ERROR|FATAL|panic' | tail -20 || true
